[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-rag"
version = "1.0.0"
description = "Source-agnostic RAG over Confluence or MediaWiki with citations and evaluation."
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools]
py-modules = ["main", "streamlit_app"]
packages = ["app", "app.core", "app.ingestion", "app.processing",
            "app.embeddings", "app.retrieval", "app.llm", "app.pipeline",
            "app.evaluation", "app.sources"]

[project.scripts]
rag-ingest = "main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
